<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doc to A4</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #0f172a; }
        .hide { display: none !important; }
        
        /* 4-Point Crop Styles */
        #cropContainer { position: relative; display: inline-block; touch-action: none; user-select: none; }
        #cropImg { max-width: 100%; max-height: 65vh; display: block; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        #cropSvg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .crop-handle {
            position: absolute; width: 48px; height: 48px; margin-top: -24px; margin-left: -24px;
            background-color: transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: grab; pointer-events: auto; z-index: 10;
        }
        .crop-handle::before { content: ''; position: absolute; width: 16px; height: 16px; border: 3px solid #6366f1; border-radius: 50%; background: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: 0.2s; }
        .crop-handle::after { content: ''; position: absolute; width: 4px; height: 4px; background: #6366f1; border-radius: 50%; }
        .crop-handle:active::before { border-color: #0f172a; transform: scale(1.2); }
        .crop-handle:active::after { background: #0f172a; }
        .crop-handle:active { cursor: grabbing; }

        /* A4 Preview */
        .a4-preview {
            width: 100%; aspect-ratio: 210 / 297;
            background: #ffffff; position: relative; border: 1px solid #e2e8f0; overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); border-radius: 6px;
        }
        .card-preview { position: absolute; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15); background-size: cover; background-position: center; transition: all 0.05s linear; border-radius: 3px; }
        
        /* Premium Sliders */
        .modern-slider { -webkit-appearance: none; background: transparent; outline: none; width: 100%; margin: 0; }
        .modern-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%;
            background: #0f172a; cursor: pointer; margin-top: -8px; transition: transform 0.1s;
            border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .modern-slider::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #cbd5e1; border-radius: 3px; }
        .modern-slider:active::-webkit-slider-thumb { transform: scale(1.1); background: #4f46e5; }

        /* Loader & Animations */
        #loader { position: fixed; inset: 0; background: rgba(248, 250, 252, 0.9); display: flex; justify-content: center; align-items: center; color: #0f172a; z-index: 60; flex-direction: column; backdrop-filter: blur(5px); }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="antialiased">

<!-- Global Loader -->
<div id="loader" class="hide">
    <div class="spinner"></div>
</div>

<!-- Custom File Name Dialog -->
<div id="nameDialog" class="hide fixed inset-0 bg-slate-900 bg-opacity-30 flex justify-center items-center z-50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-[24px] shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in border border-slate-100">
        <div class="p-8 pb-6">
            <h3 class="text-xl font-extrabold text-slate-800 mb-4">Save File As</h3>
            <input type="text" id="fileNameInput" value="A4_Document" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3.5 font-bold text-slate-700 outline-none focus:border-indigo-500 focus:bg-white transition-all">
        </div>
        <div class="flex border-t border-slate-100">
            <button onclick="closeNameDialog()" class="flex-1 p-4 font-bold text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 transition-all">Cancel</button>
            <button id="confirmNameBtn" class="flex-1 p-4 font-bold text-white bg-slate-900 hover:bg-slate-800 transition-all">Download</button>
        </div>
    </div>
</div>

<!-- Custom Notification Dialog -->
<div id="notifyDialog" class="hide fixed inset-0 bg-slate-900 bg-opacity-30 flex justify-center items-center z-50 px-4 backdrop-blur-sm">
    <div class="bg-white rounded-[24px] shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in text-center border border-slate-100">
        <div class="p-8 pb-6">
            <div class="w-16 h-16 rounded-full bg-slate-900 flex items-center justify-center mx-auto mb-5 shadow-lg shadow-slate-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p id="notifyMessage" class="text-base font-bold text-slate-600"></p>
        </div>
        <div class="border-t border-slate-100">
            <button id="notifyOkBtn" class="w-full p-4 font-bold text-white bg-slate-900 hover:bg-slate-800 transition-all">Continue</button>
        </div>
    </div>
</div>

<div class="max-w-4xl mx-auto p-4 py-8">

    <!-- UPLOAD SECTION -->
    <div id="section-upload" class="text-center mt-8">
        <h1 class="text-4xl font-black text-slate-900 tracking-tight mb-12">Doc To A4</h1>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-xl mx-auto">
            <button onclick="startProcess('front_back')" class="bg-white group flex flex-col items-center justify-center p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 hover:shadow-2xl hover:shadow-indigo-100 border-2 border-transparent hover:border-indigo-50 transition-all duration-300 h-56 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                </div>
                <span class="text-xl font-extrabold text-slate-800 relative z-10">Front + Back</span>
            </button>
            <button onclick="startProcess('front')" class="bg-white group flex flex-col items-center justify-center p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 hover:shadow-2xl hover:shadow-slate-200 border-2 border-transparent hover:border-slate-100 transition-all duration-300 h-56 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </div>
                <span class="text-xl font-extrabold text-slate-800 relative z-10">Front Only</span>
            </button>
        </div>
        <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
    </div>

    <!-- CROP SECTION -->
    <div id="section-crop" class="hide bg-white p-6 rounded-[2rem] shadow-2xl shadow-slate-200/50 text-center mt-2 max-w-2xl mx-auto">
        <div class="flex justify-center mb-8">
            <div id="cropContainer">
                <img id="cropImg" src="" alt="Crop" draggable="false">
                <svg id="cropSvg">
                    <polygon id="cropPoly" fill="rgba(99, 102, 241, 0.1)" stroke="#6366f1" stroke-width="2"/>
                </svg>
                <div id="pt1" class="crop-handle"></div>
                <div id="pt2" class="crop-handle"></div>
                <div id="pt3" class="crop-handle"></div>
                <div id="pt4" class="crop-handle"></div>
            </div>
        </div>

        <div class="flex justify-between gap-4">
            <button onclick="resetApp()" class="w-16 py-4 bg-slate-100 text-slate-500 font-bold rounded-2xl hover:bg-slate-200 transition-all flex justify-center items-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <button onclick="rotateImage()" class="flex-1 py-4 bg-slate-50 text-slate-700 font-bold rounded-2xl hover:bg-slate-100 transition-all flex justify-center items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Rotate
            </button>
            <button onclick="confirmCrop()" class="flex-1 py-4 bg-slate-900 text-white font-bold rounded-2xl hover:bg-slate-800 transition-all flex justify-center items-center shadow-lg shadow-slate-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </button>
        </div>
    </div>

    <!-- PREVIEW & ADJUSTMENTS SECTION -->
    <div id="section-preview" class="hide bg-white p-6 md:p-10 rounded-[2rem] shadow-2xl shadow-slate-200/50 mt-4 max-w-3xl mx-auto">
        
        <!-- Interactive Layout -->
        <div class="flex justify-center mb-10">
            <div class="flex items-stretch gap-4">
                
                <!-- Left Column (X Slider + A4 Paper + Size Slider) -->
                <div class="flex flex-col gap-4 w-[280px] sm:w-[340px]">
                    <div class="w-full">
                        <input type="range" id="xSlider" min="0" max="100" value="50" class="modern-slider" oninput="updatePreview()">
                    </div>
                    
                    <div class="a4-preview w-full" id="a4Box">
                        <div id="frontPreviewObj" class="card-preview hide"></div>
                        <div id="backPreviewObj" class="card-preview hide"></div>
                    </div>
                    
                    <div class="w-full">
                        <input type="range" id="sizeSlider" min="100" max="250" value="100" class="modern-slider" oninput="updatePreview()">
                    </div>
                    
                    <div class="flex justify-between items-center px-2 mt-1">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Size <span id="sizeValText" class="text-slate-800 ml-1">100%</span></span>
                        <button onclick="resetSliders()" class="text-xs font-bold text-slate-400 hover:text-slate-800 uppercase tracking-widest flex items-center transition-colors">
                            <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Reset
                        </button>
                    </div>
                </div>

                <!-- Right Column (Y Slider) -->
                <div class="relative w-6 pt-8 pb-12" id="ySliderContainer">
                    <input type="range" id="ySlider" min="0" max="100" value="50" class="modern-slider absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-90 origin-center" oninput="updatePreview()">
                </div>

            </div>
        </div>

        <!-- Options & Export -->
        <div class="max-w-sm mx-auto">
            <div id="layoutContainer" class="mb-5">
                <select id="layoutSelect" onchange="updatePreview()" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold text-slate-700 outline-none focus:border-slate-300 focus:bg-white transition-all cursor-pointer">
                    <option value="vertical">Vertical Layout</option>
                    <option value="horizontal">Horizontal Layout</option>
                </select>
            </div>

            <div class="flex flex-col gap-3">
                <button onclick="openNameDialog('JPG')" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl flex justify-center items-center shadow-lg shadow-indigo-200 transition-all">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download JPG
                </button>
                <button onclick="openNameDialog('PDF')" class="w-full py-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl flex justify-center items-center shadow-lg shadow-slate-200 transition-all">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Download PDF
                </button>
                <button onclick="resetApp()" class="w-full py-4 mt-2 bg-transparent text-slate-400 hover:text-slate-800 font-bold rounded-2xl transition-all flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Home
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentProcess = ''; let currentStep = ''; 
    let frontImgData = null; let backImgData = null; 
    let originalImgObj = null; let downloadTypePending = ''; let notifyCallback = null;

    const A4_W = 210, A4_H = 297;
    const CARD_W = 85.60, CARD_H = 53.98;
    let pts = [{x: 10, y: 10}, {x: 90, y: 10}, {x: 90, y: 90}, {x: 10, y: 90}];
    let activePoint = null;

    function showSection(id) {
        ['section-upload', 'section-crop', 'section-preview'].forEach(s => document.getElementById(s).classList.add('hide'));
        document.getElementById(id).classList.remove('hide');
        document.body.style.overflow = (id === 'section-crop') ? 'hidden' : 'auto';
    }

    function showNotification(msg, callback) {
        document.getElementById('notifyMessage').innerText = msg;
        document.getElementById('notifyDialog').classList.remove('hide');
        notifyCallback = callback;
    }
    document.getElementById('notifyOkBtn').addEventListener('click', () => {
        document.getElementById('notifyDialog').classList.add('hide');
        if(notifyCallback) notifyCallback();
    });

    function startProcess(type) {
        currentProcess = type; currentStep = (type === 'back') ? 'back' : 'front';
        document.getElementById('fileInput').click();
    }

    function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => { initCrop(ev.target.result); };
        reader.readAsDataURL(file); e.target.value = ''; 
    }

    function initCrop(imgSrc) {
        showSection('section-crop');
        const img = document.getElementById('cropImg');
        img.onload = () => {
            originalImgObj = new Image(); originalImgObj.src = img.src;
            pts = [{x: 10, y: 10}, {x: 90, y: 10}, {x: 90, y: 90}, {x: 10, y: 90}]; updateSVG();
        };
        img.src = imgSrc;
    }

    function rotateImage() {
        if(!originalImgObj) return;
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = originalImgObj.naturalHeight; canvas.height = originalImgObj.naturalWidth;
        ctx.translate(canvas.width / 2, canvas.height / 2); ctx.rotate(90 * Math.PI / 180);
        ctx.drawImage(originalImgObj, -originalImgObj.naturalWidth / 2, -originalImgObj.naturalHeight / 2);
        document.getElementById('cropImg').src = canvas.toDataURL('image/png');
    }

    function updateSVG() {
        const img = document.getElementById('cropImg');
        const w = img.offsetWidth; const h = img.offsetHeight; let pointsStr = "";
        pts.forEach((p, i) => {
            const px = (p.x / 100) * w; const py = (p.y / 100) * h; pointsStr += `${px},${py} `;
            const handle = document.getElementById(`pt${i+1}`);
            handle.style.left = `${px}px`; handle.style.top = `${py}px`;
        });
        document.getElementById('cropPoly').setAttribute('points', pointsStr.trim());
    }

    const container = document.getElementById('cropContainer');
    function getPointerPos(e) {
        const rect = container.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handleStart(e, index) { e.preventDefault(); activePoint = index; }
    function handleMove(e) {
        if (activePoint === null) return; e.preventDefault();
        const pos = getPointerPos(e); const w = container.offsetWidth; const h = container.offsetHeight;
        let px = Math.max(0, Math.min(100, (pos.x / w) * 100)); let py = Math.max(0, Math.min(100, (pos.y / h) * 100));
        pts[activePoint] = {x: px, y: py}; updateSVG();
    }
    function handleEnd() { activePoint = null; }

    [0,1,2,3].forEach(i => {
        const el = document.getElementById(`pt${i+1}`);
        el.addEventListener('mousedown', (e) => handleStart(e, i));
        el.addEventListener('touchstart', (e) => handleStart(e, i), {passive: false});
    });
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    window.addEventListener('touchend', handleEnd);

    function confirmCrop() {
        document.getElementById('loader').classList.remove('hide');
        setTimeout(() => {
            const resultImg = processPerspectiveCrop();
            if (currentStep === 'front') {
                frontImgData = resultImg;
                if (currentProcess === 'front_back') {
                    currentStep = 'back'; document.getElementById('loader').classList.add('hide');
                    showNotification("Upload the Back side.", () => { document.getElementById('fileInput').click(); });
                    return;
                }
            } else { backImgData = resultImg; }
            document.getElementById('loader').classList.add('hide');
            setupPreview();
        }, 50);
    }

    function processPerspectiveCrop() {
        const sCanvas = document.createElement('canvas');
        const sW = originalImgObj.naturalWidth; const sH = originalImgObj.naturalHeight;
        const maxDim = 2000; let scale = 1; if(sW > maxDim || sH > maxDim) { scale = maxDim / Math.max(sW, sH); }
        
        const cW = Math.round(sW * scale); const cH = Math.round(sH * scale);
        sCanvas.width = cW; sCanvas.height = cH;
        const sCtx = sCanvas.getContext('2d'); sCtx.drawImage(originalImgObj, 0, 0, cW, cH);
        const sData = sCtx.getImageData(0, 0, cW, cH);
        const corners = pts.map(p => ({ x: (p.x/100)*cW, y: (p.y/100)*cH }));

        const dW = 1011; const dH = Math.round(dW * (CARD_H / CARD_W)); 
        const dCanvas = document.createElement('canvas'); dCanvas.width = dW; dCanvas.height = dH;
        const dCtx = dCanvas.getContext('2d'); const dData = dCtx.createImageData(dW, dH);

        for (let y = 0; y < dH; y++) {
            const yF = y / dH;
            const lx = corners[0].x + (corners[3].x - corners[0].x) * yF; const ly = corners[0].y + (corners[3].y - corners[0].y) * yF;
            const rx = corners[1].x + (corners[2].x - corners[1].x) * yF; const ry = corners[1].y + (corners[2].y - corners[1].y) * yF;
            for (let x = 0; x < dW; x++) {
                const xF = x / dW;
                const srcX = Math.floor(lx + (rx - lx) * xF); const srcY = Math.floor(ly + (ry - ly) * xF);
                if (srcX >= 0 && srcX < cW && srcY >= 0 && srcY < cH) {
                    const sIdx = (srcY * cW + srcX) * 4; const dIdx = (y * dW + x) * 4;
                    dData.data[dIdx] = sData.data[sIdx]; dData.data[dIdx+1] = sData.data[sIdx+1];
                    dData.data[dIdx+2] = sData.data[sIdx+2]; dData.data[dIdx+3] = 255;
                }
            }
        }
        dCtx.putImageData(dData, 0, 0); return dCanvas.toDataURL('image/jpeg', 0.95);
    }

    function syncVerticalSliderWidth() {
        const a4Box = document.getElementById('a4Box');
        const ySlider = document.getElementById('ySlider');
        if (a4Box && ySlider && !document.getElementById('section-preview').classList.contains('hide')) {
            ySlider.style.width = a4Box.offsetHeight + 'px';
        }
    }
    window.addEventListener('resize', syncVerticalSliderWidth);

    function resetSliders() {
        document.getElementById('sizeSlider').value = 100;
        document.getElementById('xSlider').value = 50;
        document.getElementById('ySlider').value = 50;
        updatePreview();
    }

    function setupPreview() {
        showSection('section-preview');
        resetSliders();
        if(currentProcess === 'front_back') document.getElementById('layoutContainer').classList.remove('hide');
        else document.getElementById('layoutContainer').classList.add('hide');
        setTimeout(syncVerticalSliderWidth, 50); 
        updatePreview();
    }

    function updatePreview() {
        const layout = document.getElementById('layoutSelect')?.value || 'vertical';
        const frontObj = document.getElementById('frontPreviewObj');
        const backObj = document.getElementById('backPreviewObj');
        
        const sf = document.getElementById('sizeSlider').value / 100;
        const posX = document.getElementById('xSlider').value / 100;
        const posY = document.getElementById('ySlider').value / 100;

        document.getElementById('sizeValText').innerText = Math.round(sf * 100) + '%';

        const cardW_pct = ((CARD_W * sf) / A4_W) * 100; const cardH_pct = ((CARD_H * sf) / A4_H) * 100;
        const gapX_pct = ((10 * sf) / A4_W) * 100; const gapY_pct = ((15 * sf) / A4_H) * 100;

        frontObj.classList.add('hide'); backObj.classList.add('hide');

        let bbW_pct = cardW_pct; let bbH_pct = cardH_pct;
        if (currentProcess === 'front_back') {
            if (layout === 'vertical') bbH_pct = (cardH_pct * 2) + gapY_pct;
            else bbW_pct = (cardW_pct * 2) + gapX_pct;
        }

        const startX = (100 - bbW_pct) * posX;
        const startY = (100 - bbH_pct) * (1 - posY);

        function applyStyle(obj, src, t, l) {
            obj.classList.remove('hide');
            obj.style.width = cardW_pct + '%'; obj.style.height = cardH_pct + '%';
            obj.style.backgroundImage = `url(${src})`;
            obj.style.top = t + '%'; obj.style.left = l + '%';
        }

        if (currentProcess === 'front') { applyStyle(frontObj, frontImgData, startY, startX); } 
        else if (currentProcess === 'back') { applyStyle(backObj, backImgData, startY, startX); } 
        else {
            if (layout === 'vertical') {
                applyStyle(frontObj, frontImgData, startY, startX);
                applyStyle(backObj, backImgData, startY + cardH_pct + gapY_pct, startX);
            } else {
                applyStyle(frontObj, frontImgData, startY, startX);
                applyStyle(backObj, backImgData, startY, startX + cardW_pct + gapX_pct);
            }
        }
    }

    function openNameDialog(type) {
        downloadTypePending = type; document.getElementById('nameDialog').classList.remove('hide');
        const input = document.getElementById('fileNameInput'); input.focus();
        setTimeout(() => { input.setSelectionRange(input.value.length, input.value.length); }, 10);
    }
    
    function closeNameDialog() { document.getElementById('nameDialog').classList.add('hide'); }

    document.getElementById('confirmNameBtn').addEventListener('click', () => {
        let name = document.getElementById('fileNameInput').value.trim();
        if(!name) name = "A4_Document"; closeNameDialog(); executeDownload(downloadTypePending, name);
    });

    function executeDownload(type, fileName) {
        document.getElementById('loader').classList.remove('hide');
        setTimeout(() => {
            const dpi = 300; const scale = dpi / 25.4;
            const layout = document.getElementById('layoutSelect').value;
            
            const sf = document.getElementById('sizeSlider').value / 100;
            const posX = document.getElementById('xSlider').value / 100;
            const posY = document.getElementById('ySlider').value / 100;

            const pW = A4_W * scale, pH = A4_H * scale;
            const cW = CARD_W * sf * scale, cH = CARD_H * sf * scale;
            const gapX = 10 * sf * scale, gapY = 15 * sf * scale;
            
            let bbW = cW, bbH = cH;
            if(currentProcess === 'front_back') {
                if(layout === 'vertical') bbH = (cH * 2) + gapY;
                else bbW = (cW * 2) + gapX;
            }

            const startX = (pW - bbW) * posX;
            const startY = (pH - bbH) * (1 - posY);

            let items = [];
            if (currentProcess === 'front') items.push({s: frontImgData, x: startX, y: startY});
            else if (currentProcess === 'back') items.push({s: backImgData, x: startX, y: startY});
            else {
                if(layout === 'vertical'){
                    items.push({s: frontImgData, x: startX, y: startY});
                    items.push({s: backImgData, x: startX, y: startY + cH + gapY});
                } else {
                    items.push({s: frontImgData, x: startX, y: startY});
                    items.push({s: backImgData, x: startX + cW + gapX, y: startY});
                }
            }

            if (type === 'JPG') {
                const canvas = document.createElement('canvas'); canvas.width = pW; canvas.height = pH;
                const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, pW, pH);
                ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

                let loaded = 0;
                items.forEach(it => {
                    const img = new Image();
                    img.onload = () => {
                        ctx.drawImage(img, it.x, it.y, cW, cH);
                        loaded++;
                        if(loaded === items.length) {
                            canvas.toBlob(blob => {
                                const url = URL.createObjectURL(blob); const link = document.createElement('a');
                                link.download = `${fileName}.jpg`; link.href = url; link.click();
                                document.getElementById('loader').classList.add('hide');
                            }, 'image/jpeg', 1.0);
                        }
                    };
                    img.src = it.s;
                });
            } else {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ format: 'a4', unit: 'mm' });
                items.forEach(it => {
                    const mmX = it.x / scale; const mmY = it.y / scale;
                    const mmW = cW / scale; const mmH = cH / scale;
                    doc.addImage(it.s, 'JPEG', mmX, mmY, mmW, mmH, undefined, 'SLOW');
                });
                doc.save(`${fileName}.pdf`);
                document.getElementById('loader').classList.add('hide');
            }
        }, 100);
    }

    function resetApp() {
        currentProcess = ''; currentStep = ''; frontImgData = null; backImgData = null; pts = [];
        document.getElementById('fileInput').value = ''; showSection('section-upload');
    }
</script>
